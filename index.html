<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imposter Syndrome</title>

  <!-- Start fetching the big background right away -->
  <link rel="preload" as="image" href="img/layer1.webp">

  <style>
    html, body { margin: 0; background: white; }

    /* Gives the page room to scroll. JS sets its height. */
    .scroller { position: relative; }

    /* The artwork keeps the original 3:4 ratio and clips anything that
       drifts past its edges, so no layer can leave the frame. */
    .art {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      top: 0;
    }

    /* Each layer is cropped to its visible part and placed with
       percentages of the full canvas, so it scales with any screen. */
    .layer {
      position: absolute;
      display: block;
      will-change: transform;   /* own GPU layer = cheap to move */
      pointer-events: none;
      user-select: none;
    }
    .layer.bg { left: 0; top: 0; width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div class="scroller">
    <div class="art" id="art">
      <!-- data-speed: positive drifts up as you scroll, negative drifts down,
           0 stays put. Same values as the original. -->
      <img class="layer bg" data-speed="0"  src="img/layer1.webp" alt="Imposter Syndrome artwork">
      <img class="layer" data-speed="2"  src="img/layer2.webp" style="left:7.685%;top:5.5%;width:91.296%" alt="">
      <img class="layer" data-speed="1"  src="img/layer3.webp" style="left:0%;top:0%;width:97.704%" alt="">
      <img class="layer" data-speed="-3" src="img/layer4.webp" style="left:2.333%;top:28.5%;width:82.407%" alt="">
      <img class="layer" data-speed="-1" src="img/layer5.webp" style="left:25.167%;top:38.875%;width:64.463%" alt="">
      <img class="layer" data-speed="4"  src="img/layer6.webp" style="left:0.889%;top:19.639%;width:89.981%" alt="">
      <img class="layer" data-speed="-2" src="img/layer7.webp" style="left:0.185%;top:13.583%;width:83.833%" alt="">
      <img class="layer" data-speed="3"  src="img/layer8.webp" style="left:4.185%;top:24.181%;width:72.13%" alt="">
      <img class="layer" data-speed="5"  src="img/layer9.webp" style="left:2.722%;top:33.528%;width:88.63%" alt="">
    </div>
  </div>

  <script>
    // How far layers travel: each 1 of speed = this % of the artwork's height
    // over the whole scroll. Raise for a stronger effect, lower for subtler.
    var STRENGTH = 2;

    var scroller = document.querySelector('.scroller');
    var art = document.getElementById('art');
    var layers = Array.prototype.map.call(document.querySelectorAll('.layer'), function (el) {
      return { el: el, speed: parseFloat(el.dataset.speed) || 0 };
    });

    var artH = 0, maxScroll = 1, ticking = false;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function measure() {
      var vh = window.innerHeight;
      artH = art.offsetHeight;

      if (artH < vh * 1.3) {
        // Artwork fits on screen (e.g. phones): pin it in the middle and add
        // scroll room so the parallax still plays.
        art.style.position = 'sticky';
        art.style.top = Math.max(0, (vh - artH) / 2) + 'px';
        scroller.style.height = (vh * 1.8) + 'px';
      } else {
        art.style.position = 'relative';
        art.style.top = '0';
        scroller.style.height = artH + 'px';
      }
      maxScroll = Math.max(1, document.documentElement.scrollHeight - vh);
      update();
    }

    function update() {
      ticking = false;
      var progress = Math.min(1, Math.max(0, window.scrollY / maxScroll));
      // 0 at the middle of the scroll, so the layers line up exactly as
      // designed there and drift symmetrically either side.
      var t = progress - 0.5;
      for (var i = 0; i < layers.length; i++) {
        var l = layers[i];
        if (!l.speed) continue;
        var y = reduceMotion ? 0 : -l.speed * STRENGTH / 100 * artH * t;
        l.el.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
      }
    }

    function onScroll() {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    window.addEventListener('load', measure);
    measure();
  </script>
</body>
</html>
